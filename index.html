<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f8" />
    <meta
      name="description"
      content="Continuous HTTP latency measurements, time-aware history, and your connection details."
    />
    <link
      rel="preload"
      href="/fonts/inter-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      try {
        const t = localStorage.getItem("ping-theme");
        if (
          [
            "light",
            "dark",
            "light-neutral",
            "dark-neutral",
            "halloween",
            "forest",
            "dracula",
            "night",
            "dim",
            "nord",
            "sunset",
            "abyss",
            "cupcake",
            "dark-daisyui5",
            "gruvbox",
          ].includes(t)
        )
          document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <title>Ping · Network status</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
